services:
  app:
    build: .
    container_name: conflux-app
    restart: unless-stopped
    ports:
      # YunoHost reverse proxy points to http://127.0.0.1:8097
      - "127.0.0.1:8097:8080"
    environment:
      PORT: "8080"
      WEB_DIR: /app/web
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-feeduser}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-feedsocial}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      FEED_WORKER: "on"
      FEED_REFRESH_MINUTES: "15"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  db:
    image: mariadb:11
    container_name: conflux-db
    restart: unless-stopped
    volumes:
      - ./db_data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${DB_NAME:-feedsocial}
      MARIADB_USER: ${DB_USER:-feeduser}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
